<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ripple</title>
    <style>
        html{
            margin:0;
            height:100%;
            background:#111;
            overflow:hidden;
        }
        body{
            margin:0;
            height:100%;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        canvas{
            background:#000;
            cursor:crosshair;
            touch-action:none;
            display:block;
        }
        .slider{
            position:fixed;
            top:12px;
            left:12px;
            padding:10px 14px;
            background:rgba(0,0,0,0.55);
            border:1px solid #444;
            border-radius:8px;
            color:#ddd;
            font-family:sans-serif;
            font-size:13px;
        }
        .slider label{
            display:block;
            margin-bottom:10px;
        }
        .slider label:last-child{
            margin-bottom:0;
        }
        .slider input{
            display:block;
            width:180px;
            margin-top:4px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="slider">
        <label>
            Dampening: <span id="dampeningValue">0.990</span>
            <input id="dampeningSlider" type="range" min="0.9" max="1" step="0.001" value="0.99">
        </label>
        <label>
            Drop strength: <span id="strengthValue">2500</span>
            <input id="strengthSlider" type="range" min="500" max="10000" step="100" value="2500">
        </label>
    </div>
    <script>
        const canvas=document.getElementById('canvas');
        const ctx=canvas.getContext('2d');
        let col=0;
        let row=0;
        let current;
        let previous;
        let imageData;
        let pixel;
        let dampening=0.99;
        let dropStrength=2500;
        let dragging=false;
        function resizeCanvas(){
            canvas.width=window.innerWidth;
            canvas.height=window.innerHeight;
            col=canvas.width;
            row=canvas.height;
            current=new Float32Array(col*row);
            previous=new Float32Array(col*row);
            imageData=ctx.createImageData(col,row);
            pixel=imageData.data;
        }
        resizeCanvas();
        window.addEventListener('resize',resizeCanvas);
        const dampeningSlider=document.getElementById('dampeningSlider');
        const dampeningValue=document.getElementById('dampeningValue');
        const strengthSlider=document.getElementById('strengthSlider');
        const strengthValue=document.getElementById('strengthValue');
        dampeningSlider.addEventListener('input',function(){
            dampening=parseFloat(dampeningSlider.value);
            dampeningValue.textContent=dampening.toFixed(3);
        });
        strengthSlider.addEventListener('input',function(){
            dropStrength=parseFloat(strengthSlider.value);
            strengthValue.textContent=dropStrength;
        });
        function addDrop(e){
        const rect=canvas.getBoundingClientRect();
        const x=Math.floor((e.clientX-rect.left)*(col/rect.width));
        const y=Math.floor(((e.clientY-rect.top))*(row/rect.height));
        const boundary=x>0&&x<col-1&&y>0&&y<row-1;
        if(boundary){
            previous[x+y*col]=dropStrength;
        }
    }
    canvas.addEventListener('pointermove',function(e){
        if(dragging){
            addDrop(e);
        }
    });
    window.addEventListener('pointerup',function(){
        dragging=false;
    });
    canvas.addEventListener('pointerdown',function(e){
        dragging=true;
        addDrop(e);
    });
    function updateWaves(){
        for(let y=1;y<row-1;y++){
            for(let x=1;x<col-1;x++){
            const index=x+y*col;
            const left=previous[index-1];
            const right=previous[index+1];
            const up=previous[index-col];
            const down=previous[index+col];
            let value=(left+right+up+down)/2-current[index];
            value=value*dampening;
            current[index]=value;
        }
    }
}
    function drawWaves(){
        for(let i=0;i<col*row;i++){
            const p=i*4;
            pixel[p]=current[i];
            pixel[p+1]=current[i];
            pixel[p+2]=current[i];
            pixel[p+3]=255;
        }
        ctx.putImageData(imageData,0,0);
    }
    function swapBuffers(){
        const temp=previous;
        previous=current;
        current=temp;
    }
    function loop(){
        updateWaves();
        drawWaves();
        swapBuffers();
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    </script>
</body>
</html>
